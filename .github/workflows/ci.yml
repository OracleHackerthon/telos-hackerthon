name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import main"

  docker:
    # Dockerfile 이 깨지지 않았는지 이미지 빌드만 확인한다
    runs-on: ubuntu-latest
    needs: [web, ai]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml build
